# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: DeviceProfile

# Name of the device profile
name: RG Rotate DPad As Left Stick

# Description of the device profile
description: Translates the DPad into left stick deflection for games that
  expect an analog stick. Everything below the DPad block is identical to
  rg-rotate-dpad-native.yaml, so switching profiles changes only the DPad.

# Profile mappings
mapping:
  # DPad as left stick. Profiles are additive over the capability map, so only
  # the four directions need restating here; every other capability continues
  # to pass through untouched.
  - name: DPad Up as Left Stick
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - gamepad:
          axis:
            name: LeftStick
            direction: up
  - name: DPad Down as Left Stick
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - gamepad:
          axis:
            name: LeftStick
            direction: down
  - name: DPad Left as Left Stick
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - gamepad:
          axis:
            name: LeftStick
            direction: left
  - name: DPad Right as Left Stick
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - gamepad:
          axis:
            name: LeftStick
            direction: right

  # Carried over from the stock default.yaml.
  - name: LeftTop
    source_event:
      gamepad:
        button: LeftTop
    target_events:
      - gamepad:
          button: LeftPaddle1
  - name: RightTop
    source_event:
      gamepad:
        button: RightTop
    target_events:
      - gamepad:
          button: RightPaddle1
  - name: Keyboard
    source_event:
      gamepad:
        button: Keyboard
    target_events:
      - gamepad:
          button: Guide
      - gamepad:
          button: North
  - name: QuickAccess2
    source_event:
      gamepad:
        button: QuickAccess2
    target_events:
      - gamepad:
          button: Screenshot
