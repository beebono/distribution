# DSperate settings for ROCKNIX. Command-line flags override this file, and
# start_dsperate.sh passes what EmulationStation exposes as flags, so the keys
# it drives (layout, screen, linear, vsync, frameskip, the speed hacks) are
# left at their defaults here. Per-game overrides still work: games/<rom>.ini
# next to this file.
# See https://github.com/beebono/DSperate for every setting.

[user]
nickname = ROCKNIX              # up to 10 characters
message =                       # up to 26 characters
birthday_month = 1
birthday_day = 1
colour = 2                      # 0 grey, 1 brown, 2 red, 3 pink, 4 orange, 5 yellow, 6 lime,
                                # 7 green, 8 dark green, 9 turquoise, 10 blue, 11 dark blue,
                                # 12 purple, 13 violet, 14 magenta, 15 dark pink

[paths]
bios9 = /storage/roms/bios/bios9.bin
bios7 = /storage/roms/bios/bios7.bin
firmware = /storage/roms/bios/firmware.bin
games = /storage/roms/nds
saves = /storage/roms/nds
states = /storage/roms/savestates/nds
cache = /storage/.cache/dsperate

[video]
fullscreen = true
layout = horizontal
vsync = true
integer_scale = off             # off | under | over: whole panel pixels per DS pixel -- under letterboxes at the
                                # largest that fits, over crops at the smallest that covers (the edge between
                                # the screens is kept: a stacked pair crops its outer edges, a dual-window top
                                # screen keeps its bottom row and the bottom screen its top)

[emu]
frameskip_capture = true        # DO NOT TOUCH! This makes frameskip work in games that use dual screen 3D.

# Controller values are SDL controller button names (a b x y back guide
# start leftstick rightstick leftshoulder rightshoulder dpup dpdown dpleft
# dpright) or axes (+leftx -lefty +righttrigger ...). SDL names buttons by
# position, so the DS's A is the pad's "b".
[pad]
# a = b
# b = a
# x = y
# y = x
# l = leftshoulder
# r = rightshoulder
# start = start
# select = back
# up = dpup
# down = dpdown
# left = dpleft
# right = dpright
# stick_dpad = true             # left stick also works the d-pad
# stick_deadzone = 12000
# stylus_axis = right           # right | left | none: the stick that moves the pen over the
                                # bottom screen (left takes the stick away from the d-pad)
# stylus_dpad = none            # a button; while held the d-pad moves the pen (e.g. leftshoulder)
# stylus_button = rightstick    # touches at the pen's position; mod+<it> is free for a hotkey
# stylus_speed = 4.0            # pen pixels per frame at full tilt
# stylus_size = 2               # crosshair scale: arm width and centre dot, DS pixels (scaled up by the
                                # view's reduction when the bottom screen is the PiP inset / dominant secondary)
# stylus_hide = 90              # frames idle before the crosshair hides (0 = never shown)

# Hotkeys on the controller. The modifier is the pad's mode/home button
# ("guide"); if it doubles as a DS button it is withheld from the game
# while held and delivered as a tap when released alone. A chord
# "mod+start+back" needs both buttons (SDL calls the DS Select "back").
[padhotkeys]
modifier = guide
quit = mod+start
pause = mod+y
fast_forward = +righttrigger
fast_forward_toggle = mod++righttrigger
save_state = mod+rightshoulder
load_state = mod+leftshoulder
slot_next = mod+dpright
slot_prev = mod+dpleft
volume_up = none
volume_down = none
layout_next = mod+dpright
layout_prev = mod+dpleft
screen_swap = none
pip_corner_next = none
screenshot = mod+b
mic = leftstick
fps = mod+x