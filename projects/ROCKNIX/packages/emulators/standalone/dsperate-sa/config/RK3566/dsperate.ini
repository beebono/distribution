# DSperate settings for ROCKNIX. Command-line flags override this file, and
# start_dsperate.sh passes what EmulationStation exposes as flags, so the keys
# it drives (layout, screen, linear, vsync, frameskip, the speed hacks) are
# left at their defaults here. Per-game overrides still work: games/<rom>.ini
# next to this file.
# See https://github.com/beebono/DSperate for every setting.

[paths]
bios9 = /storage/roms/bios/bios9.bin
bios7 = /storage/roms/bios/bios7.bin
firmware = /storage/roms/bios/firmware.bin
games = /storage/roms/nds
saves = /storage/roms/nds
states = /storage/roms/savestates/nds
cache = /storage/.cache/dsperate

[video]
fullscreen = true
layout = horizontal
vsync = true
